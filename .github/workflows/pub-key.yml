name: publish GPG public key

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
    - name: Import GPG private key
      id: gpg
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        if [[ -z "$GPG_PRIVATE_KEY" ]]; then
          echo "::notice::GPG_PRIVATE_KEY is not set; no public key is published."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        install -m 700 -d ~/.gnupg
        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        echo "enabled=true" >> "$GITHUB_OUTPUT"

    - name: Export GPG public key
      if: steps.gpg.outputs.enabled == 'true'
      shell: bash
      run: |
        set -euo pipefail
        fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
        [[ -n "$fingerprint" ]] || { echo "No GPG secret key found."; exit 1; }
        gpg --batch --armor --export "$fingerprint" > v2rayN-public-key.asc

    - name: Upload GPG public key to release
      if: steps.gpg.outputs.enabled == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        file: v2rayN-public-key.asc
        tag: ${{ inputs.release_tag }}
        prerelease: true
        overwrite: true
